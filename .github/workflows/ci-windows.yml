name: CI Windows

# Windows minutes cost more than Linux minutes in private repositories (docs/DEVELOPMENT.md §6),
# so this workflow runs only on main when code changed, on PRs labeled "windows", and manually.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - '.github/qt-version'
      - '.github/workflows/ci-windows.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-msvc-release:
    name: windows-msvc-release
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'windows')
    runs-on: windows-2025
    timeout-minutes: 45
    # Job-level (not workflow-level) concurrency: a run that skips this job, e.g. the "opened"
    # event of a PR that gets its "windows" label a moment later, must not cancel the real run.
    concurrency:
      # github.workflow differs when called from nightly.yml, so both runs can coexist.
      group: ci-windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned versions
        id: versions
        run: |
          "qt=$((Get-Content .github/qt-version -Raw).Trim())" >> $env:GITHUB_OUTPUT
          "vcpkg=$((Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline')" >> $env:GITHUB_OUTPUT
          "version=$((Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ steps.versions.outputs.qt }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          # aqtinstall 3.3.0 cannot install Qt 6.12 on Windows (miurahr/aqtinstall#1047).
          # Pinned to the commit of the fix PR miurahr/aqtinstall#1048 until a release contains it (ADR 0012).
          aqtsource: git+https://github.com/jdpurcell/aqtinstall@6f0f842da47c744cdc814cd94da9828d934d7bf0

      - name: Check out vcpkg at the manifest baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.versions.outputs.vcpkg }}
          path: .vcpkg
          fetch-depth: 1

      # Downloads from GitHub releases (the vcpkg tool, CMake for vcpkg) intermittently fail
      # with HTTP 504; cache them so that a run needs them only when the vcpkg baseline changes.
      - name: Cache vcpkg tool and downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/vcpkg-tool
            ${{ runner.temp }}/vcpkg-downloads
          key: vcpkg-tool-windows-${{ steps.versions.outputs.vcpkg }}

      - name: Bootstrap vcpkg
        run: |
          $tool = "$env:RUNNER_TEMP\vcpkg-tool\vcpkg.exe"
          if (Test-Path $tool) {
            Copy-Item $tool ./.vcpkg/vcpkg.exe
          } else {
            # The bootstrap script itself only retries for a few seconds.
            $ok = $false
            foreach ($delay in 20, 60, 120, 0) {
              ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              if ($delay -eq 0) { break }
              Write-Host "vcpkg bootstrap failed; retrying in $delay s"
              Start-Sleep -Seconds $delay
            }
            if (-not $ok) { exit 1 }
            New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\vcpkg-tool" | Out-Null
            Copy-Item ./.vcpkg/vcpkg.exe $tool
          }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-cache" | Out-Null
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-downloads" | Out-Null
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\.vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DOWNLOADS=$env:RUNNER_TEMP\vcpkg-downloads" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$env:RUNNER_TEMP\vcpkg-cache,readwrite" >> $env:GITHUB_ENV

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-windows-msvc-release-${{ steps.versions.outputs.vcpkg }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-msvc-release-

      # Replaces ilammy/msvc-dev-cmd, which is unmaintained and still runs on the deprecated
      # Node.js 20: import the environment of vcvarsall.bat x64 into the following steps.
      - name: Set up MSVC developer environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio with C++ tools not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          Write-Host "Using $vcvars"
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vcvars`" x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Configure
        run: cmake --preset windows-msvc-release

      - name: Build
        run: cmake --build --preset windows-msvc-release

      - name: Test
        # On failure, rerun the failed tests verbosely so their output and exit code are visible.
        run: |
          ctest --preset windows-msvc-release
          if ($LASTEXITCODE -ne 0) {
            ctest --preset windows-msvc-release --rerun-failed --extra-verbose
            exit 1
          }

      - name: Install and deploy Qt
        run: |
          cmake --install build/windows-msvc-release --prefix dist
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --no-system-d3d-compiler --no-opengl-sw dist/logviewer.exe
          Copy-Item LICENSE, README.md dist/

      - name: Verify version info
        env:
          EXPECTED: ${{ steps.versions.outputs.version }}
        run: |
          $info = (Get-Item dist/logviewer.exe).VersionInfo
          "ProductName=$($info.ProductName) ProductVersion=$($info.ProductVersion) FileVersion=$($info.FileVersion)"
          if ($info.ProductVersion -ne $env:EXPECTED) { throw "ProductVersion '$($info.ProductVersion)' != '$env:EXPECTED'" }
          if ($info.ProductName -ne 'Log Viewer') { throw "ProductName is '$($info.ProductName)'" }
          Get-ChildItem dist -Recurse | Select-Object -ExpandProperty FullName

      - name: Upload portable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LogViewer-${{ steps.versions.outputs.version }}-${{ github.sha }}-windows-x64
          path: dist/
          retention-days: 7
          if-no-files-found: error
